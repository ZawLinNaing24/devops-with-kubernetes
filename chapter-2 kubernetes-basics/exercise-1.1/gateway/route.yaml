apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps-http-route
  namespace: exercises
spec:
  parentRefs:
    - name: main-gateway
  rules:
    # 1. Ping-pong application path
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      backendRefs:
        - name: pingpong-svc
          port: 8080
          
    # 2. Log-output application path
    - matches:
        - path:
            type: PathPrefix
            value: /log-output
      backendRefs:
        - name: log-output-svc
          port: 8080