apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # All manifests for the log-output application (Deployment, Service, ConfigMap, Ingress, etc.)
  - manifests/deployment.yaml
  - manifests/service.yaml
  - manifests/configmap.yaml

images:
  - name: hugonaing/log-writer
    newName: hugonaing/log-writer
    newTag: v1
  - name: hugonaing/log-reader
    newName: hugonaing/log-reader
    newTag: v2.5

# Apply a label to all resources while keeping original selectors untouched
labels:
  - pairs:
      app: log-output
    includeSelectors: false