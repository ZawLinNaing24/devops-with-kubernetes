apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes: 
      - name: shared-storage
        persistentVolumeClaim:
            claimName: shared-pv-claim
      
      - name: config-volume
        configMap: 
          name: log-output-config
      containers:
        - name: writer
          image: hugonaing/log-writer:v1
          imagePullPolicy: Always
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files

        - name: reader
          image: hugonaing/log-reader:v2.5
          imagePullPolicy: Always
          # Environment variable (MESSAGE) ထည့်သွင်းပါ
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts: 
            - name: shared-storage
              mountPath: /usr/src/app/files

              # ConfigMap volume ကို /usr/src/app/config သို့ Mount လုပ်ပါ
            - name: config-volume
              mountPath: /usr/src/app/config
          ports: 
            - containerPort: 3000

