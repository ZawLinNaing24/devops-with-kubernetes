apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: log-output-ingress
spec:
  ingressClassName: nginx   # Docker Desktop ရှိ NGINX Ingress Controller အတွက်
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: log-output-svc
                port:
                  number: 8080

          - path: /pingpong
            pathType: Prefix
            backend: 
              service: 
                name: pingpong-svc
                port: 
                  number: 8080