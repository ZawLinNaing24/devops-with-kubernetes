apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: hugonaing/todo-app:v1.5
          ports: 
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
