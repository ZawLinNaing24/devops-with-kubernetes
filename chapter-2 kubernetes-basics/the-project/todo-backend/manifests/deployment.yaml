apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: todo-pv-claim 
      containers:
        - name: todo-backend
          image: hugonaing/todo-backend:v2.10
          imagePullPolicy: Always
          ports: 
            - containerPort: 5000
          env: 
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: DATABASE_URL
            - name: PORT 
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-config
                  key: PORT
          volumeMounts:
            - name: shared-storage
              mountPath: /usr/src/app/files