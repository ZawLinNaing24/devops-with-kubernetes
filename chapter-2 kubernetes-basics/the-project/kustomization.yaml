apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests/deployment.yaml
  - manifests/service.yaml
  - manifests/configmap.yaml
  - manifests/cronjob-configmap.yaml
  - manifests/cronjob.yaml
  - manifests/ingress.yaml 
  - todo-backend

images:
  - name: HUGONAING/TODO-APP          # <-- deployment.yaml ထဲက ယာယီနာမည်ကို ရှာမယ်
    newName: hugonaing/to-do-app   # <-- ဒီ Image အစစ်နဲ့ အစားထိုးမယ်
    newTag:  "1.8"